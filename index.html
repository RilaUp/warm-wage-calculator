<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f3ea" />
    <meta
      name="description"
      content="Lalabear 的个人网站入口。更多内容正在慢慢整理，暖薪工资计算器已经可以使用。"
    />
    <title>Lalabear · 个人网站</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        font-family: "Noto Sans SC", system-ui, sans-serif;
        color: #222c28;
        background: #f7f3ea;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(circle at 15% 10%, rgba(255, 143, 110, 0.2), transparent 32%),
          radial-gradient(circle at 85% 90%, rgba(56, 111, 91, 0.18), transparent 34%),
          #f7f3ea;
      }

      main {
        width: min(760px, 100%);
        padding: clamp(32px, 7vw, 72px);
        border: 1px solid rgba(34, 44, 40, 0.1);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 70px rgba(54, 49, 39, 0.12);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #c85f47;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 560px;
        margin: 0;
        font-size: clamp(42px, 8vw, 74px);
        line-height: 1.05;
        letter-spacing: -0.045em;
      }

      .intro {
        max-width: 560px;
        margin: 24px 0 38px;
        color: #64706b;
        font-size: clamp(17px, 2.5vw, 21px);
        line-height: 1.7;
      }

      .tool-link {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-height: 52px;
        padding: 0 22px;
        border-radius: 14px;
        color: white;
        background: #386f5b;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 12px 30px rgba(56, 111, 91, 0.24);
        transition:
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      .tool-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 36px rgba(56, 111, 91, 0.3);
      }

      .note {
        margin: 24px 0 0;
        color: #87908c;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Lalabear</p>
      <h1>你好，欢迎来到我的小小空间。</h1>
      <p class="intro">
        个人网站正在慢慢整理中。现在可以先使用我做的暖薪工资计算器，把每个月的工作安排与报酬算得清楚、说得温柔。
      </p>
      <a class="tool-link" href="/salary-calculator">
        打开暖薪工资计算器
        <span aria-hidden="true">→</span>
      </a>
      <p class="note">更多内容，稍后见。</p>
    </main>
  </body>
</html>
